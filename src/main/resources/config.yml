# ============================================
#  挂机假人插件 (AfkBot) - 配置文件
#  修改后执行 /bot reload 生效
# ============================================

# 假人数量上限
# 服务器中最多可同时存在的假人数量
max-bots: 10

# 是否在 Tab 玩家列表（按 Esc 看到的列表）中显示假人
# true  = 假人看起来像真实在线玩家
# false = 只能通过 /bot list 查看假人
show-in-tab: true

# 假人是否无敌
# true  = 假人不会受到任何伤害（推荐）
# false = 假人可以被攻击
invulnerable: true
